<svg viewBox="0 0 940 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3A5A8C"/>
    </linearGradient>
    <linearGradient id="complex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37475E"/>
      <stop offset="100%" stop-color="#232F3E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="500" fill="url(#sky2)"/>
  <text x="470" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">Moving Day: House → Cloud Complex</text>
  <text x="470" y="60" text-anchor="middle" font-size="13" fill="#CBD5E1">Fixed capacity, on your own — vs. a building that resizes your unit on demand</text>

  <!-- Left: house -->
  <polygon points="70,220 150,160 230,220" fill="#B36B00"/>
  <rect x="90" y="220" width="120" height="110" fill="#8B5A2B" stroke="#5C3A1A" stroke-width="3"/>
  <rect x="130" y="260" width="40" height="70" fill="#5C3A1A"/>
  <text x="150" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Owned / rented house</text>
  <text x="150" y="370" text-anchor="middle" font-size="11" fill="#CBD5E1">(on-premises or traditional hosting)</text>
  <text x="150" y="392" text-anchor="middle" font-size="10.5" fill="#F2B4B4">Fixed size — growth needs new construction</text>

  <!-- Moving truck -->
  <g>
    <rect x="330" y="270" width="120" height="55" rx="6" fill="#FF9900" stroke="#B36B00" stroke-width="2"/>
    <rect x="450" y="290" width="40" height="35" rx="4" fill="#FFD873" stroke="#B36B00" stroke-width="2"/>
    <circle cx="360" cy="330" r="14" fill="#232F3E"/>
    <circle cx="420" cy="330" r="14" fill="#232F3E"/>
    <circle cx="470" cy="330" r="14" fill="#232F3E"/>
    <text x="390" y="305" text-anchor="middle" font-size="20">📦</text>
  </g>
  <text x="410" y="355" text-anchor="middle" font-size="11" fill="#FFD873">migration</text>
  <line x1="240" y1="290" x2="325" y2="290" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a5)"/>
  <line x1="495" y1="290" x2="590" y2="290" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a5)"/>
  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#FFFFFF"/>
    </marker>
  </defs>

  <!-- Right: apartment complex -->
  <rect x="600" y="120" width="280" height="210" fill="url(#complex)" stroke="#0F1621" stroke-width="3" rx="6"/>
  <text x="740" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">THE CLOUD</text>
  <!-- windows grid representing resizable units -->
  <g fill="#FFD873">
    <rect x="620" y="140" width="30" height="30" rx="3"/>
    <rect x="660" y="140" width="30" height="30" rx="3"/>
    <rect x="700" y="140" width="30" height="30" rx="3"/>
    <rect x="740" y="140" width="30" height="30" rx="3" fill="#FF9900"/>
    <rect x="780" y="140" width="30" height="30" rx="3"/>
    <rect x="820" y="140" width="30" height="30" rx="3"/>
    <rect x="620" y="185" width="30" height="30" rx="3"/>
    <rect x="660" y="185" width="30" height="30" rx="3" fill="#FF9900"/>
    <rect x="700" y="185" width="30" height="30" rx="3" fill="#FF9900"/>
    <rect x="740" y="185" width="30" height="30" rx="3" fill="#FF9900"/>
    <rect x="780" y="185" width="30" height="30" rx="3"/>
    <rect x="820" y="185" width="30" height="30" rx="3"/>
    <rect x="620" y="230" width="30" height="30" rx="3"/>
    <rect x="660" y="230" width="30" height="30" rx="3"/>
    <rect x="700" y="230" width="30" height="30" rx="3"/>
    <rect x="740" y="230" width="30" height="30" rx="3"/>
    <rect x="780" y="230" width="30" height="30" rx="3" fill="#FF9900"/>
    <rect x="820" y="230" width="30" height="30" rx="3"/>
    <rect x="620" y="275" width="30" height="30" rx="3"/>
    <rect x="660" y="275" width="30" height="30" rx="3"/>
    <rect x="700" y="275" width="30" height="30" rx="3"/>
    <rect x="740" y="275" width="30" height="30" rx="3"/>
    <rect x="780" y="275" width="30" height="30" rx="3"/>
    <rect x="820" y="275" width="30" height="30" rx="3"/>
  </g>
  <text x="740" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Elastic apartment complex</text>
  <text x="740" y="370" text-anchor="middle" font-size="11" fill="#CBD5E1">(orange units = your resized workload)</text>
  <text x="740" y="392" text-anchor="middle" font-size="10.5" fill="#B7EE9A">Add or shrink rooms overnight, no construction</text>

  <rect x="60" y="430" width="820" height="50" rx="8" fill="#0F1621" stroke="#FF9900"/>
  <text x="470" y="460" text-anchor="middle" font-size="13" fill="#FFFFFF">"Move the furniture in first. Redecorate room by room."</text>
</svg>
