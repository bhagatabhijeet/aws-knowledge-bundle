<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" fill="#F7F9FC"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#232F3E">IAM Core Entities</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5A6B7D">Users, Groups, Roles &amp; the Policies that govern them</text>

  <!-- Group box -->
  <rect x="60" y="110" width="260" height="150" rx="12" fill="#DCEEFB" stroke="#146EB4" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F8A">🗂️ Group: Developers</text>
  <rect x="90" y="158" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#146EB4"/>
  <text x="190" y="178" text-anchor="middle" font-size="12" fill="#0B4F8A">policy: EC2ReadOnlyAccess</text>
  <rect x="90" y="196" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#146EB4"/>
  <text x="190" y="216" text-anchor="middle" font-size="12" fill="#0B4F8A">policy: S3FullAccess</text>

  <!-- Users -->
  <g>
    <circle cx="120" cy="330" r="26" fill="#FF9900"/>
    <text x="120" y="336" text-anchor="middle" font-size="18">🪪</text>
    <text x="120" y="372" text-anchor="middle" font-size="12.5" fill="#232F3E">priya</text>
  </g>
  <g>
    <circle cx="200" cy="330" r="26" fill="#FF9900"/>
    <text x="200" y="336" text-anchor="middle" font-size="18">🪪</text>
    <text x="200" y="372" text-anchor="middle" font-size="12.5" fill="#232F3E">sam</text>
  </g>
  <g>
    <circle cx="280" cy="330" r="26" fill="#FF9900"/>
    <text x="280" y="336" text-anchor="middle" font-size="18">🪪</text>
    <text x="280" y="372" text-anchor="middle" font-size="12.5" fill="#232F3E">ci-bot</text>
  </g>
  <line x1="190" y1="260" x2="120" y2="304" stroke="#146EB4" stroke-width="2"/>
  <line x1="190" y1="260" x2="200" y2="304" stroke="#146EB4" stroke-width="2"/>
  <line x1="190" y1="260" x2="280" y2="304" stroke="#146EB4" stroke-width="2"/>
  <text x="190" y="290" text-anchor="middle" font-size="11" fill="#5A6B7D">members of</text>

  <!-- Role box -->
  <rect x="560" y="110" width="280" height="150" rx="12" fill="#FDE9CF" stroke="#FF9900" stroke-width="2"/>
  <text x="700" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4A00">🎫 Role: LambdaExecRole</text>
  <text x="590" y="165" font-size="12" fill="#7A4A00" font-weight="600">Trust policy:</text>
  <text x="600" y="182" font-size="11.5" fill="#7A4A00">"lambda.amazonaws.com" may assume</text>
  <text x="590" y="204" font-size="12" fill="#7A4A00" font-weight="600">Permissions policy:</text>
  <text x="600" y="221" font-size="11.5" fill="#7A4A00">dynamodb:PutItem, logs:*</text>
  <text x="590" y="242" font-size="11" fill="#B36B00" font-style="italic">No permanent owner — assumed, then expires</text>

  <g>
    <rect x="660" y="330" width="80" height="46" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="2"/>
    <text x="700" y="358" text-anchor="middle" font-size="18">λ</text>
  </g>
  <text x="700" y="392" text-anchor="middle" font-size="12" fill="#232F3E">AWS Lambda function</text>
  <line x1="700" y1="260" x2="700" y2="330" stroke="#FF9900" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="300" font-size="11" fill="#7A4A00">assumes</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#FF9900"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <rect x="60" y="430" width="780" height="50" rx="8" fill="#EDEFF3" stroke="#C9D2DC"/>
  <text x="450" y="460" text-anchor="middle" font-size="13" fill="#232F3E">Users are permanent badges. Groups are badge templates. Roles are temporary passes anyone trusted can pick up.</text>
</svg>
