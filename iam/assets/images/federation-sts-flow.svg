<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#F7F9FC"/>
  <text x="470" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#232F3E">Federation &amp; STS — the Front Desk</text>
  <text x="470" y="58" text-anchor="middle" font-size="13" fill="#5A6B7D">Check the outside ID, hand over a pass that expires</text>

  <!-- Outside visitor -->
  <text x="80" y="180" font-size="40">🧑</text>
  <text x="80" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#232F3E">External User</text>

  <!-- IdP -->
  <rect x="180" y="140" width="150" height="90" rx="10" fill="#DCEEFB" stroke="#146EB4" stroke-width="2"/>
  <text x="255" y="175" text-anchor="middle" font-size="24">🏢</text>
  <text x="255" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#0B4F8A">Identity Provider</text>
  <text x="255" y="216" text-anchor="middle" font-size="10.5" fill="#0B4F8A">(SAML / OIDC / SSO)</text>

  <!-- STS front desk -->
  <rect x="400" y="120" width="180" height="130" rx="10" fill="#FDE9CF" stroke="#FF9900" stroke-width="2"/>
  <text x="490" y="158" text-anchor="middle" font-size="26">🛎️</text>
  <text x="490" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#7A4A00">AWS STS</text>
  <text x="490" y="204" text-anchor="middle" font-size="10.5" fill="#7A4A00">checks role's</text>
  <text x="490" y="218" text-anchor="middle" font-size="10.5" fill="#7A4A00">trust policy</text>
  <text x="490" y="238" text-anchor="middle" font-size="10" fill="#B36B00">AssumeRoleWithSAML /</text>

  <!-- Role -->
  <rect x="640" y="120" width="150" height="130" rx="10" fill="#E7F6E5" stroke="#59B200" stroke-width="2"/>
  <text x="715" y="158" text-anchor="middle" font-size="26">🎫</text>
  <text x="715" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#2E5C00">Temp Credentials</text>
  <text x="715" y="204" text-anchor="middle" font-size="10.5" fill="#2E5C00">Access Key +</text>
  <text x="715" y="218" text-anchor="middle" font-size="10.5" fill="#2E5C00">Secret + Session Token</text>
  <text x="715" y="238" text-anchor="middle" font-size="10" fill="#2E5C00">expires in minutes-hours</text>

  <!-- AWS resource -->
  <rect x="830" y="150" width="70" height="70" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="865" y="192" text-anchor="middle" font-size="26">☁️</text>
  <text x="865" y="240" text-anchor="middle" font-size="11" fill="#232F3E">AWS API</text>

  <!-- Arrows -->
  <line x1="115" y1="190" x2="175" y2="190" stroke="#232F3E" stroke-width="2" marker-end="url(#a3)"/>
  <text x="145" y="180" text-anchor="middle" font-size="10">1. sign in</text>

  <line x1="330" y1="190" x2="395" y2="190" stroke="#232F3E" stroke-width="2" marker-end="url(#a3)"/>
  <text x="362" y="180" text-anchor="middle" font-size="10">2. assertion</text>

  <line x1="580" y1="190" x2="635" y2="190" stroke="#232F3E" stroke-width="2" marker-end="url(#a3)"/>
  <text x="605" y="180" text-anchor="middle" font-size="10">3. issue</text>

  <line x1="790" y1="190" x2="825" y2="190" stroke="#232F3E" stroke-width="2" marker-end="url(#a3)"/>
  <text x="805" y="180" text-anchor="middle" font-size="10">4. call</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect x="80" y="300" width="780" height="70" rx="10" fill="#EDEFF3" stroke="#C9D2DC"/>
  <text x="470" y="330" text-anchor="middle" font-size="13" fill="#232F3E">"Don't print a badge for every visitor. Check their outside ID at the desk</text>
  <text x="470" y="350" text-anchor="middle" font-size="13" fill="#232F3E">and hand them a pass that expires when they leave."</text>
</svg>
