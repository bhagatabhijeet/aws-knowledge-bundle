<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#F7F9FC"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#232F3E">Users vs Roles</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#5A6B7D">Permanent badge vs self-expiring visitor pass</text>

  <!-- User column -->
  <rect x="60" y="90" width="360" height="340" rx="14" fill="#DCEEFB" stroke="#146EB4" stroke-width="2"/>
  <text x="240" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#0B4F8A">🪪 IAM User</text>
  <rect x="190" y="150" width="100" height="70" rx="8" fill="#FFFFFF" stroke="#146EB4" stroke-width="2"/>
  <text x="240" y="192" text-anchor="middle" font-size="30">🪪</text>
  <text x="240" y="245" text-anchor="middle" font-size="13" fill="#0B4F8A" font-weight="600">Printed once, kept forever</text>

  <text x="90" y="280" font-size="12.5" fill="#0B4F8A">• One specific owner</text>
  <text x="90" y="304" font-size="12.5" fill="#0B4F8A">• Long-lived password / access keys</text>
  <text x="90" y="328" font-size="12.5" fill="#0B4F8A">• Valid until manually revoked</text>
  <text x="90" y="352" font-size="12.5" fill="#0B4F8A">• Best for: rare standing-access humans</text>
  <text x="90" y="390" font-size="12" fill="#8A0000" font-weight="700">⚠ If leaked, it works until noticed</text>

  <!-- Role column -->
  <rect x="480" y="90" width="360" height="340" rx="14" fill="#FDE9CF" stroke="#FF9900" stroke-width="2"/>
  <text x="660" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#7A4A00">🎫 IAM Role</text>
  <rect x="610" y="150" width="100" height="70" rx="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="660" y="192" text-anchor="middle" font-size="30">🎫</text>
  <text x="660" y="245" text-anchor="middle" font-size="13" fill="#7A4A00" font-weight="600">Picked up, used, self-destructs</text>

  <text x="510" y="280" font-size="12.5" fill="#7A4A00">• No owner — anyone trusted can assume it</text>
  <text x="510" y="304" font-size="12.5" fill="#7A4A00">• Temporary session credentials</text>
  <text x="510" y="328" font-size="12.5" fill="#7A4A00">• Auto-expires (minutes to hours)</text>
  <text x="510" y="352" font-size="12.5" fill="#7A4A00">• Best for: apps, cross-account, federation</text>
  <text x="510" y="390" font-size="12" fill="#1D6B00" font-weight="700">✓ Even if leaked, it stops working soon</text>

  <text x="450" y="450" text-anchor="middle" font-size="12" fill="#5A6B7D">"A user is a badge you'd recognize on a security camera. A role is a pass anyone approved can borrow."</text>
</svg>
