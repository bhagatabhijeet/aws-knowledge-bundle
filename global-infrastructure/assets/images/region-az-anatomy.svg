<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="sky8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3A5A8C"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="url(#sky8)"/>
  <text x="470" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">One Region, Three Boroughs</text>
  <text x="470" y="60" text-anchor="middle" font-size="13" fill="#CBD5E1">us-east-1 — independent Availability Zones, linked by private fiber</text>

  <!-- Region boundary -->
  <rect x="60" y="90" width="820" height="360" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="10,6" rx="14"/>
  <text x="470" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#FF9900">REGION: us-east-1 (the city)</text>

  <!-- AZ A -->
  <rect x="90" y="120" width="230" height="290" fill="#232F3E" stroke="#146EB4" stroke-width="2" rx="10"/>
  <text x="205" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#B7CFE0">🏘️ AZ: us-east-1a</text>
  <text x="205" y="160" text-anchor="middle" font-size="9" fill="#8FA9C2">AZ ID: use1-az1</text>
  <rect x="115" y="175" width="80" height="60" fill="#146EB4" rx="4"/>
  <text x="155" y="210" text-anchor="middle" font-size="20">🏢</text>
  <rect x="215" y="175" width="80" height="60" fill="#146EB4" rx="4"/>
  <text x="255" y="210" text-anchor="middle" font-size="20">🏢</text>
  <text x="205" y="255" text-anchor="middle" font-size="9" fill="#CBD5E1">own power substation</text>
  <text x="205" y="270" text-anchor="middle" font-size="9" fill="#CBD5E1">own cooling &amp; networking</text>
  <text x="205" y="290" text-anchor="middle" font-size="9" fill="#CBD5E1">physically separate building(s)</text>

  <!-- AZ B -->
  <rect x="355" y="120" width="230" height="290" fill="#232F3E" stroke="#146EB4" stroke-width="2" rx="10"/>
  <text x="470" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#B7CFE0">🏘️ AZ: us-east-1b</text>
  <text x="470" y="160" text-anchor="middle" font-size="9" fill="#8FA9C2">AZ ID: use1-az2</text>
  <rect x="380" y="175" width="80" height="60" fill="#146EB4" rx="4"/>
  <text x="420" y="210" text-anchor="middle" font-size="20">🏢</text>
  <rect x="480" y="175" width="80" height="60" fill="#146EB4" rx="4"/>
  <text x="520" y="210" text-anchor="middle" font-size="20">🏢</text>
  <text x="470" y="255" text-anchor="middle" font-size="9" fill="#CBD5E1">own power substation</text>
  <text x="470" y="270" text-anchor="middle" font-size="9" fill="#CBD5E1">own cooling &amp; networking</text>
  <text x="470" y="290" text-anchor="middle" font-size="9" fill="#CBD5E1">physically separate building(s)</text>

  <!-- AZ C -->
  <rect x="620" y="120" width="230" height="290" fill="#232F3E" stroke="#146EB4" stroke-width="2" rx="10"/>
  <text x="735" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#B7CFE0">🏘️ AZ: us-east-1c</text>
  <text x="735" y="160" text-anchor="middle" font-size="9" fill="#8FA9C2">AZ ID: use1-az3</text>
  <rect x="645" y="175" width="80" height="60" fill="#146EB4" rx="4"/>
  <text x="685" y="210" text-anchor="middle" font-size="20">🏢</text>
  <rect x="745" y="175" width="80" height="60" fill="#146EB4" rx="4"/>
  <text x="785" y="210" text-anchor="middle" font-size="20">🏢</text>
  <text x="735" y="255" text-anchor="middle" font-size="9" fill="#CBD5E1">own power substation</text>
  <text x="735" y="270" text-anchor="middle" font-size="9" fill="#CBD5E1">own cooling &amp; networking</text>
  <text x="735" y="290" text-anchor="middle" font-size="9" fill="#CBD5E1">physically separate building(s)</text>

  <!-- private links between AZs -->
  <line x1="320" y1="175" x2="355" y2="175" stroke="#FFD873" stroke-width="4"/>
  <line x1="585" y1="175" x2="620" y2="175" stroke="#FFD873" stroke-width="4"/>
  <text x="337" y="165" text-anchor="middle" font-size="8" fill="#FFD873">private fiber</text>
  <text x="602" y="165" text-anchor="middle" font-size="8" fill="#FFD873">private fiber</text>

  <rect x="205" y="330" width="530" height="65" fill="#0F1621" stroke="#FF9900" rx="8"/>
  <text x="470" y="352" text-anchor="middle" font-size="11" fill="#FFFFFF">Many km apart — one AZ's blackout never reaches another —</text>
  <text x="470" y="372" text-anchor="middle" font-size="11" fill="#FFFFFF">yet close enough for single-digit-millisecond, synchronous replication</text>

  <text x="470" y="430" text-anchor="middle" font-size="12" fill="#CBD5E1">Spread your app across 2+ AZs and one building's bad day stops being your outage.</text>
</svg>
