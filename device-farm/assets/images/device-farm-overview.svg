<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3A5A8C"/>
    </linearGradient>
    <linearGradient id="barnwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B23A2E"/>
      <stop offset="100%" stop-color="#7A2A21"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="url(#sky4)"/>
  <text x="470" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">The AWS Device Farm</text>
  <text x="470" y="60" text-anchor="middle" font-size="13" fill="#CBD5E1">Real animals in the barn, robot horses in the stable</text>

  <!-- Barn -->
  <rect x="90" y="140" width="360" height="270" fill="url(#barnwall)" stroke="#4A130D" stroke-width="3" rx="4"/>
  <polygon points="70,140 270,80 470,140" fill="#FF9900" stroke="#B36B00" stroke-width="2"/>
  <text x="270" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#232F3E">REAL DEVICE BARN</text>

  <!-- Pens (device pool) -->
  <rect x="115" y="170" width="140" height="100" fill="#F4E3C1" stroke="#7A2A21" stroke-width="2" rx="6"/>
  <text x="185" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#4A130D">🐄 Device Pool A</text>
  <text x="185" y="210" text-anchor="middle" font-size="18">📱📱📱</text>
  <text x="185" y="235" text-anchor="middle" font-size="9" fill="#4A130D">real phones + tablets</text>

  <rect x="270" y="170" width="150" height="100" fill="#F4E3C1" stroke="#7A2A21" stroke-width="2" rx="6"/>
  <text x="345" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#4A130D">🚧 Private Pasture</text>
  <text x="345" y="210" text-anchor="middle" font-size="18">📱🔒</text>
  <text x="345" y="235" text-anchor="middle" font-size="9" fill="#4A130D">yours alone, state persists</text>

  <rect x="115" y="285" width="305" height="105" fill="#2E3F55" stroke="#0F1621" stroke-width="2" rx="6"/>
  <text x="267" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#FFD873">🤠 Ranch hand — automated run</text>
  <text x="267" y="326" text-anchor="middle" font-size="10" fill="#FFFFFF">runs every device in the pool</text>
  <text x="267" y="342" text-anchor="middle" font-size="10" fill="#FFFFFF">in parallel (server-side execution)</text>
  <text x="267" y="365" text-anchor="middle" font-size="10" fill="#B7CFE0">🕹️ or reach in yourself: Remote Access</text>

  <!-- Stable -->
  <rect x="540" y="180" width="330" height="230" fill="#37475E" stroke="#0F1621" stroke-width="3" rx="4"/>
  <polygon points="520,180 705,125 890,180" fill="#146EB4" stroke="#0B4F8A" stroke-width="2"/>
  <text x="705" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">BROWSER STABLE</text>

  <rect x="565" y="210" width="270" height="90" fill="#DCEEFB" stroke="#146EB4" stroke-width="2" rx="6"/>
  <text x="700" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#0B4F8A">🐴 Robot horses — Selenium Grid</text>
  <text x="700" y="252" text-anchor="middle" font-size="10" fill="#0B4F8A">Chrome  ·  Firefox  ·  Internet Explorer</text>
  <text x="700" y="272" text-anchor="middle" font-size="10" fill="#0B4F8A">run in parallel, pay per browser-minute</text>

  <rect x="565" y="315" width="270" height="75" fill="#0F1621" stroke="#FF9900" rx="6"/>
  <text x="700" y="338" text-anchor="middle" font-size="11" fill="#FFFFFF">📹🩺 Vet's checkup report:</text>
  <text x="700" y="356" text-anchor="middle" font-size="11" fill="#FFFFFF">video + logs + performance data,</text>
  <text x="700" y="374" text-anchor="middle" font-size="11" fill="#FFFFFF">from every run, on both sides of the farm</text>

  <text x="470" y="500" text-anchor="middle" font-size="13" fill="#FFFFFF">Rent a herd (device pool) or a stall of robot horses. Run the course. Read the checkup report.</text>
</svg>
