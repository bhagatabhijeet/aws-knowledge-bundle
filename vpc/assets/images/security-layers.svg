<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="skyv3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3A5A8C"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="url(#skyv3)"/>
  <text x="470" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">The Lock and the Guard Booth</text>
  <text x="470" y="57" text-anchor="middle" font-size="12" fill="#CBD5E1">Security Groups (per-instance, stateful) layered inside Network ACLs (per-subnet, stateless)</text>

  <!-- Subnet boundary = NACL -->
  <rect x="120" y="90" width="700" height="380" fill="#2E3F55" stroke="#FF9900" stroke-width="4" rx="14"/>
  <rect x="80" y="150" width="60" height="80" fill="#0F1621" stroke="#FF9900" stroke-width="2" rx="8"/>
  <text x="110" y="185" text-anchor="middle" font-size="22">🚧</text>
  <text x="110" y="205" text-anchor="middle" font-size="7" fill="#FFD873">Guard</text>
  <text x="110" y="215" text-anchor="middle" font-size="7" fill="#FFD873">Booth</text>
  <text x="180" y="115" font-size="12" font-weight="700" fill="#FFD873">Network ACL — subnet-wide, stateless</text>
  <text x="180" y="132" font-size="9" fill="#B7CFE0">checks inbound AND outbound independently, allow + deny, rule order matters</text>

  <!-- House 1 = instance with SG -->
  <rect x="160" y="160" width="200" height="150" fill="#232F3E" stroke="#146EB4" stroke-width="2" rx="10"/>
  <text x="260" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#B7CFE0">🔒 Security Group A</text>
  <text x="260" y="230" text-anchor="middle" font-size="30">🏠</text>
  <text x="260" y="255" text-anchor="middle" font-size="9" fill="#B7CFE0">App server instance</text>
  <text x="260" y="272" text-anchor="middle" font-size="8" fill="#8FA9C2">stateful — allow only</text>
  <text x="260" y="288" text-anchor="middle" font-size="8" fill="#8FA9C2">reply traffic auto-allowed</text>

  <!-- House 2 -->
  <rect x="400" y="160" width="200" height="150" fill="#232F3E" stroke="#146EB4" stroke-width="2" rx="10"/>
  <text x="500" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#B7CFE0">🔒 Security Group B</text>
  <text x="500" y="230" text-anchor="middle" font-size="30">🏠</text>
  <text x="500" y="255" text-anchor="middle" font-size="9" fill="#B7CFE0">Database instance</text>
  <text x="500" y="272" text-anchor="middle" font-size="8" fill="#8FA9C2">stateful — allow only</text>
  <text x="500" y="288" text-anchor="middle" font-size="8" fill="#8FA9C2">source: Security Group A</text>

  <!-- House 3 -->
  <rect x="640" y="160" width="150" height="150" fill="#232F3E" stroke="#146EB4" stroke-width="2" rx="10"/>
  <text x="715" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#B7CFE0">🔒 Security Group C</text>
  <text x="715" y="230" text-anchor="middle" font-size="30">🏠</text>
  <text x="715" y="255" text-anchor="middle" font-size="9" fill="#B7CFE0">Cache instance</text>
  <text x="715" y="272" text-anchor="middle" font-size="8" fill="#8FA9C2">stateful — allow only</text>

  <!-- traffic arrows through guard booth -->
  <line x1="45" y1="190" x2="80" y2="190" stroke="#FFD873" stroke-width="3"/>
  <polygon points="80,183 96,190 80,197" fill="#FFD873"/>
  <line x1="140" y1="190" x2="160" y2="220" stroke="#FFD873" stroke-width="3"/>

  <rect x="200" y="430" width="540" height="60" fill="#0F1621" stroke="#FF9900" rx="8"/>
  <text x="470" y="453" text-anchor="middle" font-size="10" fill="#FFFFFF">Every request crosses the guard booth (NACL) first, then the specific house's lock (Security Group).</text>
  <text x="470" y="472" text-anchor="middle" font-size="10" fill="#FFFFFF">The booth checks both directions every time; the lock remembers who it already let in.</text>
</svg>
