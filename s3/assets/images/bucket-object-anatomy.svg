<svg viewBox="0 0 940 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="940" height="460" fill="#F7F9FC"/>
  <text x="470" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#232F3E">Anatomy of a Bucket &amp; Object</text>

  <!-- Bucket -->
  <rect x="50" y="90" width="380" height="330" rx="14" fill="#DCEEFB" stroke="#146EB4" stroke-width="2"/>
  <text x="240" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#0B4F8A">🏠 Bucket: "project-photos"</text>
  <text x="240" y="144" text-anchor="middle" font-size="11" fill="#0B4F8A">Region: us-east-1 · globally unique name</text>

  <!-- flat namespace visual -->
  <rect x="80" y="165" width="320" height="220" fill="#FFFFFF" stroke="#0B4F8A" stroke-width="1.5" rx="6"/>
  <text x="240" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#0B4F8A">Flat namespace — every "folder" is just a shared prefix</text>
  <text x="100" y="212" font-size="12" fill="#232F3E" font-family="monospace">2026/vacation.jpg</text>
  <text x="100" y="236" font-size="12" fill="#232F3E" font-family="monospace">2026/family.jpg</text>
  <text x="100" y="260" font-size="12" fill="#232F3E" font-family="monospace">2025/newyear.jpg</text>
  <text x="100" y="284" font-size="12" fill="#232F3E" font-family="monospace">invoices/march.pdf</text>
  <text x="100" y="308" font-size="12" fill="#232F3E" font-family="monospace">invoices/april.pdf</text>
  <text x="100" y="340" text-anchor="start" font-size="10.5" fill="#5A6B7D" font-style="italic">↑ "photos/" and "invoices/" are not</text>
  <text x="100" y="356" text-anchor="start" font-size="10.5" fill="#5A6B7D" font-style="italic">real folders — just prefixes</text>

  <!-- Object anatomy -->
  <rect x="500" y="90" width="390" height="330" rx="14" fill="#FDE9CF" stroke="#FF9900" stroke-width="2"/>
  <text x="695" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#7A4A00">📦 One Object</text>

  <rect x="530" y="150" width="330" height="50" rx="6" fill="#FFFFFF" stroke="#7A4A00"/>
  <text x="545" y="172" font-size="12" font-weight="700" fill="#7A4A00">Key:</text>
  <text x="590" y="172" font-size="12" fill="#232F3E" font-family="monospace">2026/vacation.jpg</text>
  <text x="545" y="190" font-size="10" fill="#B36B00">the label on the box</text>

  <rect x="530" y="212" width="330" height="60" rx="6" fill="#FFFFFF" stroke="#7A4A00"/>
  <text x="545" y="234" font-size="12" font-weight="700" fill="#7A4A00">Value:</text>
  <text x="600" y="234" font-size="12" fill="#232F3E">[ raw bytes of the JPEG ]</text>
  <text x="545" y="256" font-size="10" fill="#B36B00">0 bytes up to 5 TB</text>

  <rect x="530" y="284" width="330" height="60" rx="6" fill="#FFFFFF" stroke="#7A4A00"/>
  <text x="545" y="306" font-size="12" font-weight="700" fill="#7A4A00">Metadata:</text>
  <text x="545" y="324" font-size="11" fill="#232F3E" font-family="monospace">Content-Type: image/jpeg</text>
  <text x="545" y="338" font-size="11" fill="#232F3E" font-family="monospace">x-amz-meta-project: apollo</text>

  <rect x="530" y="356" width="330" height="44" rx="6" fill="#FFFFFF" stroke="#7A4A00"/>
  <text x="545" y="382" font-size="12" font-weight="700" fill="#7A4A00">Version ID:</text>
  <text x="640" y="382" font-size="11" fill="#232F3E" font-family="monospace">3sL4kqt...  (if versioning on)</text>

  <text x="470" y="440" text-anchor="middle" font-size="12.5" fill="#232F3E">Key + Value + Metadata = one object. The bucket is just a flat set of these.</text>
</svg>
