<svg viewBox="0 0 940 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3A5A8C"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#37475E"/>
      <stop offset="100%" stop-color="#232F3E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="540" fill="url(#sky3)"/>
  <text x="470" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">The S3 Self-Storage Facility</text>
  <text x="470" y="60" text-anchor="middle" font-size="13" fill="#CBD5E1">Simple Storage Service — three S's, twice</text>

  <!-- Warehouse building -->
  <rect x="130" y="110" width="680" height="360" fill="url(#wall2)" stroke="#0F1621" stroke-width="3" rx="6"/>
  <polygon points="110,110 470,55 830,110" fill="#FF9900" stroke="#B36B00" stroke-width="2"/>
  <text x="470" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">S3 REGION WAREHOUSE</text>

  <!-- Units row -->
  <g>
    <rect x="160" y="140" width="160" height="130" fill="#DCEEFB" stroke="#146EB4" stroke-width="2" rx="6"/>
    <text x="240" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#0B4F8A">🏠 Bucket A</text>
    <rect x="180" y="180" width="40" height="30" fill="#FFFFFF" stroke="#0B4F8A"/>
    <rect x="230" y="180" width="40" height="30" fill="#FFFFFF" stroke="#0B4F8A"/>
    <rect x="180" y="220" width="40" height="30" fill="#FFFFFF" stroke="#0B4F8A"/>
    <text x="240" y="260" text-anchor="middle" font-size="10" fill="#0B4F8A">boxes = objects</text>

    <rect x="390" y="140" width="160" height="130" fill="#FDE9CF" stroke="#FF9900" stroke-width="2" rx="6"/>
    <text x="470" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#7A4A00">🏠 Bucket B</text>
    <rect x="410" y="180" width="40" height="30" fill="#FFFFFF" stroke="#7A4A00"/>
    <rect x="460" y="180" width="40" height="30" fill="#FFFFFF" stroke="#7A4A00"/>
    <rect x="410" y="220" width="40" height="30" fill="#FFFFFF" stroke="#7A4A00"/>
    <rect x="460" y="220" width="40" height="30" fill="#FFFFFF" stroke="#7A4A00"/>

    <rect x="620" y="140" width="160" height="130" fill="#E7F6E5" stroke="#59B200" stroke-width="2" rx="6"/>
    <text x="700" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#2E5C00">🏠 Bucket C</text>
    <rect x="640" y="180" width="40" height="30" fill="#FFFFFF" stroke="#2E5C00"/>
    <rect x="690" y="180" width="40" height="30" fill="#FFFFFF" stroke="#2E5C00"/>
  </g>

  <!-- Shelves aisle -->
  <rect x="160" y="300" width="620" height="140" fill="#2E3F55" stroke="#0F1621" stroke-width="2" rx="6"/>
  <text x="470" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD873">Shelves = Storage Classes</text>
  <rect x="180" y="335" width="120" height="25" fill="#FF9900" rx="4"/>
  <text x="240" y="352" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="700">Standard (front)</text>
  <rect x="180" y="365" width="120" height="25" fill="#FFB84D" rx="4"/>
  <text x="240" y="382" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="700">Intelligent-Tiering</text>
  <rect x="180" y="395" width="120" height="25" fill="#FFD08A" rx="4"/>
  <text x="240" y="412" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="700">Standard-IA</text>

  <rect x="330" y="335" width="120" height="25" fill="#B7CFE0" rx="4"/>
  <text x="390" y="352" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="700">Glacier Instant</text>
  <rect x="330" y="365" width="120" height="25" fill="#8FA9C2" rx="4"/>
  <text x="390" y="382" text-anchor="middle" font-size="10" fill="#232F3E" font-weight="700">Glacier Flexible</text>
  <rect x="330" y="395" width="120" height="25" fill="#5C7A9C" rx="4"/>
  <text x="390" y="412" text-anchor="middle" font-size="10" fill="#FFFFFF" font-weight="700">Glacier Deep Archive</text>

  <rect x="490" y="335" width="270" height="85" fill="#0F1621" stroke="#FF9900" rx="6"/>
  <text x="625" y="360" text-anchor="middle" font-size="11" fill="#FFFFFF">"The closer to the door,</text>
  <text x="625" y="378" text-anchor="middle" font-size="11" fill="#FFFFFF">the more it costs to store —</text>
  <text x="625" y="396" text-anchor="middle" font-size="11" fill="#FFFFFF">the less it costs to grab."</text>

  <text x="470" y="500" text-anchor="middle" font-size="13" fill="#FFFFFF">Rent a unit (bucket). Fill it with boxes (objects). Pick a shelf (storage class) for each.</text>
</svg>
