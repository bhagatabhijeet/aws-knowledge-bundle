<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="940" height="420" fill="#F7F9FC"/>
  <text x="470" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#232F3E">Replication — Sister Warehouses</text>

  <!-- Source warehouse -->
  <rect x="70" y="100" width="300" height="200" rx="12" fill="#DCEEFB" stroke="#146EB4" stroke-width="2"/>
  <text x="220" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#0B4F8A">Source Bucket — us-east-1</text>
  <text x="220" y="146" text-anchor="middle" font-size="10.5" fill="#0B4F8A">(versioning ON)</text>
  <rect x="110" y="165" width="50" height="40" fill="#FFFFFF" stroke="#0B4F8A" rx="4"/>
  <rect x="170" y="165" width="50" height="40" fill="#FF9900" stroke="#0B4F8A" rx="4"/>
  <text x="195" y="220" text-anchor="middle" font-size="9" fill="#0B4F8A">new box</text>
  <rect x="230" y="165" width="50" height="40" fill="#FFFFFF" stroke="#0B4F8A" rx="4"/>

  <!-- Destination warehouse -->
  <rect x="570" y="100" width="300" height="200" rx="12" fill="#E7F6E5" stroke="#59B200" stroke-width="2"/>
  <text x="720" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#2E5C00">Destination Bucket — eu-west-1</text>
  <text x="720" y="146" text-anchor="middle" font-size="10.5" fill="#2E5C00">(versioning ON)</text>
  <rect x="610" y="165" width="50" height="40" fill="#FFFFFF" stroke="#2E5C00" rx="4"/>
  <rect x="670" y="165" width="50" height="40" fill="#FF9900" stroke="#2E5C00" stroke-width="2" stroke-dasharray="4,3" rx="4"/>
  <text x="695" y="220" text-anchor="middle" font-size="9" fill="#2E5C00">replica arrives</text>
  <rect x="730" y="165" width="50" height="40" fill="#FFFFFF" stroke="#2E5C00" rx="4"/>

  <!-- IAM role in the middle -->
  <rect x="400" y="150" width="140" height="70" rx="10" fill="#FDE9CF" stroke="#FF9900" stroke-width="2"/>
  <text x="470" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="#7A4A00">🎫 IAM Role</text>
  <text x="470" y="196" text-anchor="middle" font-size="10" fill="#7A4A00">read source,</text>
  <text x="470" y="210" text-anchor="middle" font-size="10" fill="#7A4A00">write destination</text>

  <line x1="370" y1="185" x2="398" y2="185" stroke="#232F3E" stroke-width="2" marker-end="url(#a9)"/>
  <line x1="542" y1="185" x2="568" y2="185" stroke="#232F3E" stroke-width="2" marker-end="url(#a9)"/>
  <defs>
    <marker id="a9" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect x="90" y="330" width="760" height="60" rx="10" fill="#EDEFF3" stroke="#C9D2DC"/>
  <text x="470" y="355" text-anchor="middle" font-size="13" fill="#232F3E">"Every time a new box arrives, immediately ship an identical copy</text>
  <text x="470" y="375" text-anchor="middle" font-size="13" fill="#232F3E">to our sister warehouse." — asynchronous, versioning required on both sides.</text>
</svg>
